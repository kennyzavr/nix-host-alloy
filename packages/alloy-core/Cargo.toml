[package]
name = "alloy-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
petgraph = "0.6"
log = "0.4"
itertools = "0.15.0"
either = "1.18.0"
chrono = "0.4.45"
tempfile = "3.27.0"
nix = { version = "0.31.3", features = ["poll", "term", "fs", "signal", "process"] }
shlex = "2.0.1"
zeroize = "1.9.0"
