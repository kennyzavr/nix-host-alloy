[package]
name = "cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

# [lints.rust]
# warnings = "allow"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
color-eyre = "0.6.5"
eyre = "0.6.14"
owo-colors = "4.4.0"
comfy-table = "8.0.0"
ptree = "0.5.2"
thiserror = "2.0.20"
miette = { version = "7.6.0", features = ["fancy"] }
console = "0.16.6"
tempfile = "3.27.0"
age = "0.12.1"
